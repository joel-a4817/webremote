<section class="hidden" id="upload-screen">
 <div class="header-row">
  <button class="back" id="upload-back" type="button">
   Back
  </button>
  <h1>
   Upload Music
  </h1>
  <div>
  </div>
 </div>
 <div class="upload-card">
  <input accept="audio/mp4,audio/m4a,audio/mpeg,audio/aac,audio/wav,.m4a,.mp3,.aac,.alac,.wav" id="music-files" multiple type="file">
  <div aria-live="polite" class="upload-file-list" id="upload-file-list">
  </div>
  <div class="playlist-checks" id="upload-playlist-checks">
  </div>
  <button class="upload-submit" id="upload-submit" type="button">
   Import Selected Files
  </button>
 </div>
</section>
